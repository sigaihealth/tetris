services:
  tetris:
    build:
      context: .
    image: sigai/tetris:internal
    container_name: tetris
    restart: unless-stopped
    ports:
      - "3612:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
